
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YTube Download</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
background:#101827;
color:white;
font-family:Arial,sans-serif;
text-align:center;
}
header{
padding:28px 10px;
font-size:28px;
font-weight:bold;
color:#35d6a0;
}
.container{
max-width:550px;
margin:55px auto;
padding:30px 20px;
background:#1e293b;
border-radius:16px;
}
h1{font-size:27px}
p{color:#cbd5e1}
.platforms{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
margin:25px 0;
}
.platforms button{
padding:13px 17px;
background:#334155;
color:white;
border:1px solid #475569;
border-radius:9px;
font-size:15px;
}
.platforms button.active{
background:#16a085;
}
input{
width:100%;
padding:16px;
border:0;
border-radius:9px;
font-size:15px;
margin:12px 0;
}
.mainbtn{
width:100%;
padding:15px;
margin-top:12px;
background:#16a085;
color:white;
border:0;
border-radius:9px;
font-size:17px;
font-weight:bold;
}
#message{
margin-top:20px;
color:#35d6a0;
}
footer{
padding:25px;
color:#94a3b8;
}
  #videoPreview{
  background:#000;
  box-shadow:0 4px 15px rgba(0,0,0,0.4);
}

#fileInfo{
  color:#35d6a0;
  font-size:14px;
  margin:12px 0;
}

.mainbtn{
  cursor:pointer;
  transition:0.3s;
}

.mainbtn:active{
  transform:scale(0.97);
}
</style>
</head>
<body>
<header>▶ YTube Download</header>








<div class="container">
<h1>Video Downloader</h1>
<p>Choose platform and paste your video link</p>

<div class="platforms">
<button class="active" onclick="choose('YouTube',this)">YouTube</button>
<button onclick="choose('Facebook',this)">Facebook</button>
<button onclick="choose('Instagram',this)">Instagram</button>
</div>

<input id="url" type="url"
placeholder="Paste video link here">

<p>Select your MP4 video:</p>
<input type="file" id="videoFile" accept="video/mp4">
<p id="fileInfo"></p> 
<video id="videoPreview"
controls
style="width:100%; max-width:400px; display:none; margin:15px auto; border-radius:10px;">
</video>
<button class="mainbtn" onclick="checkLink()">
Check Link
</button>
  <button class="mainbtn" onclick="downloadVideo()">
Download MP4 Video
</button>

<div id="message"></div>
</div>
  <h3>Direct MP4 Video</h3>

<input type="url" id="mp4Url" placeholder="Paste MP4 video link">

<button class="mainbtn" onclick="checkMP4Link()">
Check MP4 Link
</button>

<p id="mp4Message"></p>
  <button class="mainbtn" onclick="testBackend()">
Test Backend
</button>

<footer>
© 2026 YTube Download
<br><br>
Only use videos you own or have permission to download.
</footer>

<script>

let platform = "YouTube";

function choose(name, button) {
  platform = name;

  document.querySelectorAll('.platforms button')
    .forEach(b => b.classList.remove('active'));

  button.classList.add('active');
  document.getElementById('message').innerText =
    name + " selected";
}

function checkLink() {
  let link = document.getElementById('url').value.trim();
  let message = document.getElementById('message');

  if (!link) {
    message.innerText = "Please paste a video link!";
    return;
  }

  try {
    let url = new URL(link);

    if (url.protocol !== "https:" && url.protocol !== "http:") {
      throw new Error();
    }

    let host = url.hostname.toLowerCase();
    let valid = false;

    if (platform === "YouTube") {
      valid = host === "youtube.com" ||
        host.endsWith(".youtube.com") ||
        host === "youtu.be";
    } else if (platform === "Facebook") {
      valid = host === "facebook.com" ||
        host.endsWith(".facebook.com") ||
        host === "fb.watch";
    } else if (platform === "Instagram") {
      valid = host === "instagram.com" ||
        host.endsWith(".instagram.com");
    }

    message.innerText = valid
      ? platform + " link detected successfully!"
      : "Please enter a valid " + platform + " link.";

  } catch (e) {
    message.innerText = "Invalid video URL!";
  }
}

document.getElementById("videoFile").addEventListener("change", function() {
  let file = this.files[0];
  let info = document.getElementById("fileInfo");
  let preview = document.getElementById("videoPreview");

  if (!file) {
    info.innerText = "";
    preview.removeAttribute("src");
    preview.style.display = "none";
    return;
  }

  let size = (file.size / (1024 * 1024)).toFixed(2);

  info.innerText = "Video: " + file.name +
    " | Size: " + size + " MB";

  let videoURL = URL.createObjectURL(file);
  preview.src = videoURL;
  preview.style.display = "block";
  preview.load();
});

function downloadVideo() {
  let file = document.getElementById("videoFile").files[0];

  if (!file) {
    alert("Please select an MP4 video first!");
    return;
  }

  if (file.type !== "video/mp4") {
    alert("Please select an MP4 video!");
    return;
  }

  let videoURL = URL.createObjectURL(file);
  let a = document.createElement("a");

  a.href = videoURL;
  a.download = file.name;
  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(() => URL.revokeObjectURL(videoURL), 1000);
}
async function testBackend() {
  try {
    const response = await fetch("/api/check");
    const data = await response.json();
    alert(data.message);
  } catch (error) {
    alert("Backend connection failed!");
  }
}
</script>

</body>
</html>
