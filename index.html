

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YTube Download</title>
<style>
body{
background:#101827;
color:white;
font-family:Arial;
text-align:center;
margin:0;
}
header{
padding:25px;
font-size:28px;
color:#35d6a0;
font-weight:bold;
}
.container{
background:#1e293b;
margin:60px 15px;
padding:25px 15px;
border-radius:15px;
}
input{
width:90%;
padding:15px;
border:0;
border-radius:8px;
margin:15px 0;
}
button{
background:#16a085;
color:white;
padding:15px 30px;
border:0;
border-radius:8px;
font-size:17px;
}
</style>
</head>
<body>
<header>▶ YTube Download</header>
<div class="container">
<h2>Video Download Center</h2>
<p>Paste your video link here</p>
<input type="url" placeholder="Enter video URL">
<br>
<button onclick="detectPlatform()">
Check Link
</button>
</div>
<p>© 2026 YTube Download</p>
<script>
function detectPlatform() {
 const link = document.querySelector('input').value;

 if(link.includes('youtube.com') || link.includes('youtu.be')) {
 alert('YouTube Link Detected!');
 }
 else if(link.includes('facebook.com') || link.includes('fb.watch')) {
 alert('Facebook Link Detected!');
 }
 else if(link.includes('instagram.com')) {
 alert('Instagram Link Detected!');
 }
 else {
 alert('Please enter a valid link!');
 }
}
</script> 
</body>
</html>
